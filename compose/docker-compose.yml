services:
  victim:
    build: ./victim
    container_name: victim
    hostname: victim
    networks:
      idsnet:
        ipv4_address: 172.28.0.10
    # Porty su naviazane LEN na localhost hostitela (127.0.0.1) - testovacia
    # siet ostava izolovana od LAN/WiFi. Utoky aj benigna prevadzka bezia
    # vnutri siete idsnet, tieto porty sluzia len na rucne prezeranie.
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:8080:80"
    tty: true

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: dvwa
    hostname: dvwa
    networks:
      idsnet:
        ipv4_address: 172.28.0.11
    ports:
      - "127.0.0.1:8081:80"

  attacker:
    build: ./attacker
    container_name: attacker
    hostname: attacker
    networks:
      idsnet:
        ipv4_address: 172.28.0.20
    volumes:
      - ../scripts:/scripts
      - ../results:/results
    tty: true
    stdin_open: true
    cap_add:
      - NET_RAW
      - NET_ADMIN

  # Legitimny pouzivatel siete - generuje benignu prevadzku NA POZADI pocas
  # celeho testu (web, DNS, SSH, FTP). Ma vlastnu IP, takze alerty sa daju
  # jednoznacne priradit: 172.28.0.20 = utok, 172.28.0.30 = benigna prevadzka.
  client:
    build: ./attacker          # rovnaky image (curl, dig, sshpass), bez NET_RAW
    container_name: client
    hostname: client
    networks:
      idsnet:
        ipv4_address: 172.28.0.30
    volumes:
      - ../scripts:/scripts:ro
    tty: true

  evebox:
    image: jasonish/evebox:0.29.0
    container_name: evebox
    command: >
      evebox server --host 0.0.0.0 --database sqlite --no-auth --no-tls
      -D /data --end /var/log/suricata/eve.json
    volumes:
      - /var/log/suricata:/var/log/suricata:ro
      - evebox_data:/data
    ports:
      # --no-auth => dashboard smie byt dostupny iba z hostitela
      - "127.0.0.1:5636:5636"
    # nie je sucastou idsnet - EveBox len cita subor eve.json z hostitela,
    # nepotrebuje pristup k testovacej sieti

volumes:
  evebox_data:

networks:
  idsnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-idsnet
    ipam:
      config:
        - subnet: 172.28.0.0/24
