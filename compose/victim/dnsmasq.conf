# Lokalny DNS server testovacej siete (len autoritativna zona .lab,
# ziadne preposielanie von - siet ostava izolovana)
no-resolv
no-hosts
listen-address=172.28.0.10
bind-interfaces
domain=lab
local=/lab/
address=/victim.lab/172.28.0.10
address=/dvwa.lab/172.28.0.11
address=/www.lab/172.28.0.10
address=/ftp.lab/172.28.0.10
log-queries
